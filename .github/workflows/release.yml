name: Release

# La release est créée PAR CE WORKFLOW, jamais à la main dans l'interface GitHub.
#
# Motif : l'auteur d'une release n'est pas modifiable après coup, et une release
# créée dans l'interface porte le compte personnel de qui a cliqué. C'est ainsi
# que ce dépôt public d'organisation s'est retrouvé rattaché à une personne
# (constaté le 2026-08-20). Créée par un workflow, elle est attribuée à
# github-actions[bot], qui n'est le compte de personne.
#
# DÉCLENCHEMENT PAR L'ÉTIQUETTE, ET PAR ELLE SEULE (PLAN-1383). L'ancien
# déclenchement manuel (`workflow_dispatch`) affichait publiquement, dans l'onglet
# Actions, le compte personnel qui avait cliqué (« Manually run by ... »), alors
# même que la release était attribuée au bot. Une exécution déclenchée par une
# poussée d'étiquette porte le compte qui POUSSE, soit le compte machine
# `mobupay-tech` utilisé par scripts/publish-connector.sh du monorepo. Ne pas
# rajouter de `workflow_dispatch` : quelqu'un finirait par le lancer sous son nom.
#
# Le zip reproduit exactement scripts/build-connector-zip.sh du monorepo : le SDK
# PHP est empaqueté dans lib/ parce qu'un marchand WordPress n'a pas composer.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  SLUG: mobupay-for-woocommerce
  PRODUCT: Mobupay for WooCommerce
  # Étiquette de mobupay/mobupay-php empaquetée dans lib/.
  # PLAN-960 : la v1.0.0 envoie `amount` au remboursement, que l'API IGNORE :
  # tout remboursement partiel partait en TOTALITE. `amountCents` depuis la v1.1.0.
  SDK_REF: v1.1.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le plugin à l'étiquette poussée
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          path: plugin
          # Historique et étiquettes complets : les notes de version vont de
          # l'étiquette précédente à celle-ci.
          fetch-depth: 0

      - name: Vérifier que l'étiquette et le plugin annoncent la même version
        working-directory: plugin
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          DECLAREE=$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*\([0-9.]*\).*/\1/p' mobupay-for-woocommerce.php | head -1)
          STABLE=$(sed -n 's/^Stable tag:[[:space:]]*\([0-9.]*\).*/\1/p' readme.txt | head -1)
          if [ "$DECLAREE" != "$VERSION" ] || [ "$STABLE" != "$VERSION" ]; then
            echo "::error::Étiquette $TAG, mais le plugin déclare Version: $DECLAREE et Stable tag: $STABLE. Release refusée."
            exit 1
          fi

      - name: Récupérer le SDK PHP
        uses: actions/checkout@v7
        with:
          repository: mobupay/mobupay-php
          ref: ${{ env.SDK_REF }}
          path: sdk

      - name: Construire le zip distribuable
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/$SLUG"

          # 1. Fichiers du plugin. SECURITY.md et .github appartiennent au dépôt,
          #    pas au plugin installé chez le marchand : ils ne sont pas distribués.
          (cd plugin && tar cf - \
            --exclude='.git*' --exclude='.github' --exclude='SECURITY.md' \
            --exclude='node_modules' --exclude='vendor' --exclude='test-harness' \
            --exclude='*.zip' --exclude='.env*' \
            .) | (cd "$STAGE/$SLUG" && tar xf -)

          # 2. SDK dans lib/mobupay-php (source + LICENSE + composer.json).
          mkdir -p "$STAGE/$SLUG/lib/mobupay-php/src"
          # PLAN-960 — GARDE : le SDK empaquete doit envoyer `amountCents` au
          # remboursement. Un SDK anterieur envoie `amount`, que l'API ignore, et chaque
          # remboursement partiel rembourserait la TOTALITE du paiement.
          if ! grep -q "amountCents" sdk/src/MobupayClient.php; then
            echo "::error::Le SDK $SDK_REF n'envoie pas amountCents au remboursement : release refusee."
            exit 1
          fi
          cp sdk/src/*.php     "$STAGE/$SLUG/lib/mobupay-php/src/"
          cp sdk/LICENSE       "$STAGE/$SLUG/lib/mobupay-php/LICENSE"
          cp sdk/composer.json "$STAGE/$SLUG/lib/mobupay-php/composer.json"

          # wordpress.org rejette le cURL direct : la passerelle injecte toujours
          # le transport wp_remote_*, donc CurlTransport serait du code mort dans
          # le zip et Plugin Check le signalerait.
          rm -f "$STAGE/$SLUG/lib/mobupay-php/src/CurlTransport.php"

          # 3. Jamais d'URL de recette ni de secret réel dans un zip distribué.
          if grep -rnE "staging\.mobupay\.nc|sk_(live|test)_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}" "$STAGE/$SLUG"; then
            echo "[ERR] Motif interdit détecté dans le zip (recette/secret). Abandon." >&2
            exit 1
          fi

          # 4. Garde de dérive : ces trois chemins n'ont jamais leur place dans le zip.
          for f in SECURITY.md .github lib/mobupay-php/src/CurlTransport.php; do
            if [ -e "$STAGE/$SLUG/$f" ]; then
              echo "[ERR] $f présent dans le zip. Abandon." >&2
              exit 1
            fi
          done

          ZIP="$GITHUB_WORKSPACE/$SLUG-$VERSION.zip"
          (cd "$STAGE" && zip -rq "$ZIP" "$SLUG")
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

          echo "--- contenu du zip ---"
          unzip -Z1 "$ZIP" | sort

      - name: Extraire les notes de version du changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # Étiquette précédente : les notes couvrent toutes les versions entre les
          # deux, y compris celles qui n'ont jamais eu d'étiquette.
          PREV=$(git -C plugin describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          PREV="${PREV#v}"
          # readme.txt : section « == Changelog == », une entrée par « = X.Y.Z = ».
          awk -v v="$VERSION" -v p="$PREV" '
            /^== / && on { exit }
            /^= [0-9]/ {
              if (on && (p == "" || $2 == p)) exit
              if ($2 == v) on = 1
              if (on) { print "### " $2; next }
            }
            on { print }
          ' plugin/readme.txt > notes.md
          echo "--- notes ---"
          cat notes.md

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "[ERR] La release $TAG existe déjà." >&2
            echo "      Son auteur n'étant pas modifiable, la supprimer d'abord," >&2
            echo "      puis repousser l'étiquette." >&2
            exit 1
          fi
          TITLE="$PRODUCT ${TAG#v}"
          if [ -s notes.md ]; then
            gh release create "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file notes.md
          else
            gh release create "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --generate-notes
          fi
          echo "[OK] Release $TAG créée, attribuée à github-actions[bot]."
